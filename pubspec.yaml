name: mantra_app
description: Mantra Sangraha - Digital library of sacred mantras
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.1.0 <4.0.0'
  flutter: '>=3.1.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_markdown: ^0.7.0
  provider: ^6.1.0
  shared_preferences: ^2.2.0
  google_fonts: ^6.1.0
  sqflite: ^2.3.0
  path: any
  path_provider: ^2.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/data/
    - assets/content/mantra_sangraha/
    - assets/content/mantra_mahodadhi/
    - assets/content/mantra_maharnava_devi_khanda/
