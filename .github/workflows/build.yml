name: Build Flutter APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Generate platform files
        run: |
          # Create a temp Flutter project to get all generated platform files
          flutter create --org com.mantrasangraha --project-name mantra_app /tmp/flutter_temp
          
          # Copy generated Android files we're missing (resources, gradle wrapper, etc.)
          cp -r /tmp/flutter_temp/android/app/src/main/res/ android/app/src/main/res/
          cp /tmp/flutter_temp/android/gradle/wrapper/gradle-wrapper.jar android/gradle/wrapper/ 2>/dev/null || true
          
          # Copy generated metadata files
          cp /tmp/flutter_temp/android/local.properties android/ 2>/dev/null || true
          
          # Clean up
          rm -rf /tmp/flutter_temp

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
